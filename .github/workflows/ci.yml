name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copilote_ia_business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/copilote_ia_business_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace packages/shared
          npm run build --workspace packages/copilot-engine

      - name: Apply database migrations
        run: npm run prisma:deploy --workspace apps/api

      - name: Typecheck & build API
        run: npm run build --workspace apps/api

      - name: Unit tests
        run: npm run test:api

      - name: E2E tests
        run: npm run test:e2e:api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Typecheck & build web
        run: npm run build --workspace apps/web

      - name: Unit tests
        run: npm run test:web
